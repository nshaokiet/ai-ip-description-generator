independence:
  implementer_self_review_is_independent_approval: false
  planner_rationale_is_implementation_proof: false
  security_and_quality_are_separate_streams: true
  required_reviews_target_same_final_implementation_sha: true
  reviewers_may_remediate_tracked_implementation: false
  stale_sha_pass_reusable: false

mcp_foundation:
  phase_b1:
    purpose: ADDITIVE_V2_DATA_FOUNDATION
    activates_workflow_v2: false
  phase_b2:
    purpose: ROLE_SPEC_IMPLEMENTATION_CI_REVIEW_OPERATIONS
    activates_workflow_v2: false
  phase_b3:
    purpose: FAIL_CLOSED_MERGE_EVIDENCE_READ
    primary_capability: project.get_merge_gate
    activates_workflow_v2: false
    authoritative_merge_adapter_available: false

out_of_scope:
  phase_e_workflow_activation: true
  p1_future_skills: true
  budget_quota_changes: true
  provider_api_network_integrations: true
  application_backend_frontend_changes: true
