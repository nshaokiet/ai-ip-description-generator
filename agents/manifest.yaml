schema_version: 2
package:
  id: gov-agent-001-agent-package
  version: 0.2.0
  phase: D
  status: IMPLEMENTED_FOR_REVIEW
  workflow_v2_activation: NOT_ACTIVATED
  client_model_independent: true

evidence_semantics:
  recorded_equals_verified: false
  provisional_ready_equals_authoritative_merge_eligible: false
  authoritative_source_verification_required: true
  fresh_premerge_check_required_for_authoritative_merge: true

skill_resolution:
  supported_major: 1
  missing_required: BLOCKED
  incompatible_major: BLOCKED
  unavailable_required: BLOCKED
  governance_conflict: BLOCKED
  task_spec_may_narrow_only: true
  silent_substitution_allowed: false

roles:
  PLANNER:
    contract: roles/planner.md
    tracked_implementation_write: false
    independent_verdict: NONE
    required_p0_skills:
      - shared/project-context@^1.0
      - shared/governance@^1.0
      - shared/git-safety@^1.0
      - shared/testing-policy@^1.0
      - shared/ai-ip-domain@^1.0
      - planner/task-specification@^1.0
      - planner/architecture-analysis@^1.0
    compatible_mcp_capabilities:
      - project.get_state
      - project.get_assignments
      - project.submit_spec
      - project.get_spec
  IMPLEMENTER:
    contract: roles/implementer.md
    tracked_implementation_write: AUTHORIZED_TASK_SCOPE_ONLY
    independent_verdict: NONE
    required_p0_skills:
      - shared/project-context@^1.0
      - shared/governance@^1.0
      - shared/git-safety@^1.0
      - shared/testing-policy@^1.0
      - shared/ai-ip-domain@^1.0
      - implementer/specification-execution@^1.0
      - implementer/safe-code-change@^1.0
    compatible_mcp_capabilities:
      - project.get_state
      - project.get_assignments
      - project.get_spec
      - project.start_implementation
      - project.record_implementation
      - project.record_ci
      - review.get_status
      - project.get_merge_gate
  SECURITY_REVIEWER:
    contract: roles/security-reviewer.md
    tracked_implementation_write: false
    independent_verdict: SECURITY_ONLY
    review_type: SECURITY
    review_template: review-templates/security-review.md
    required_p0_skills:
      - shared/project-context@^1.0
      - shared/governance@^1.0
      - shared/git-safety@^1.0
      - shared/testing-policy@^1.0
      - shared/ai-ip-domain@^1.0
      - security/threat-modeling@^1.0
      - security/ai-security@^1.0
    compatible_mcp_capabilities:
      - project.get_state
      - project.get_assignments
      - project.get_spec
      - review.start
      - review.submit
      - review.get_status
      - project.get_merge_gate
  QUALITY_REVIEWER:
    contract: roles/quality-reviewer.md
    tracked_implementation_write: false
    independent_verdict: QUALITY_ONLY
    review_type: QUALITY
    review_template: review-templates/quality-review.md
    required_p0_skills:
      - shared/project-context@^1.0
      - shared/governance@^1.0
      - shared/git-safety@^1.0
      - shared/testing-policy@^1.0
      - shared/ai-ip-domain@^1.0
      - quality/fixed-sha-review@^1.0
      - quality/spec-compliance@^1.0
      - quality/patent-conversion-review@^1.0
    compatible_mcp_capabilities:
      - project.get_state
      - project.get_assignments
      - project.get_spec
      - review.start
      - review.submit
      - review.get_status
      - project.get_merge_gate

