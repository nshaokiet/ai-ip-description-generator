name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_OPENAI_LIVE_TESTS: "0"
      RUN_OPENAI_DRAFT_LIVE_TESTS: "0"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      - name: Show Python versions
        run: |
          python --version
          python -m pip --version

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Run offline backend regression
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Install offline document layout QA tools
        run: |
          bash tests/backend/install_p2_006_qa.sh

      - name: Validate synthetic editable DOCX layout using headless LibreOffice
        run: |
          mkdir -p "$RUNNER_TEMP/p2-006-layout-qa"
          python tests/backend/qa_p2_006_libreoffice.py "$RUNNER_TEMP/p2-006-layout-qa"

      - name: Reproduce both public patent reference measurements
        run: |
          mkdir -p "$RUNNER_TEMP/p2-006-reference-qa"
          curl --fail --location --retry 2 https://patentimages.storage.googleapis.com/91/f6/9b/18dc2af29220c8/US11367264.pdf --output "$RUNNER_TEMP/p2-006-reference-qa/US11367264.pdf"
          curl --fail --location --retry 2 https://patentimages.storage.googleapis.com/42/19/af/1c5089854ab9d4/US11044591.pdf --output "$RUNNER_TEMP/p2-006-reference-qa/US11044591.pdf"
          python tests/backend/measure_p2_006_references.py "$RUNNER_TEMP/p2-006-reference-qa" --verify docs/tasks/P2-006-reference-measurements.json --compare "$RUNNER_TEMP/p2-006-layout-qa"

      - name: Archive public reference calibration (QA only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-006-public-reference-calibration
          path: |
            ${{ runner.temp }}/p2-006-reference-qa/*.png
            ${{ runner.temp }}/p2-006-reference-qa/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Archive synthetic renderer layout QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-006-synthetic-layout-qa
          path: |
            ${{ runner.temp }}/p2-006-layout-qa/*.pdf
            ${{ runner.temp }}/p2-006-layout-qa/*.png
            ${{ runner.temp }}/p2-006-layout-qa/*.json
            ${{ runner.temp }}/p2-006-layout-qa/p2-005-*-p2-006/*.pdf
            ${{ runner.temp }}/p2-006-layout-qa/p2-005-*-p2-006/*.docx
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show Node versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run synthetic browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_PYTHON: python
        run: npm run test:e2e

      - name: Archive synthetic UIUX browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-002-synthetic-browser-qa
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build Render static demo export
        working-directory: frontend
        env:
          RENDER_STATIC_EXPORT: "1"
          NEXT_PUBLIC_DEMO_STAGING: "1"
        run: npm run build

      - name: Verify static demo output contains no provider secret markers
        working-directory: frontend
        run: |
          test -f out/index.html
          test -f out/brand/vnuhcm-innovation-hub-logo.png
          ! grep -R -E 'OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}|gpt-5\.6-sol' out

      - name: Run Render synthetic demo browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_PYTHON: python
        run: npm run test:e2e:demo
