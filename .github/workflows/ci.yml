name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_OPENAI_LIVE_TESTS: "0"
      RUN_OPENAI_DRAFT_LIVE_TESTS: "0"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      - name: Show Python versions
        run: |
          python --version
          python -m pip --version

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Run offline backend regression
        run: python -m pytest tests -q -p no:cacheprovider

      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show Node versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run synthetic browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_PYTHON: python
        run: npm run test:e2e

      - name: Build Render static demo export
        working-directory: frontend
        env:
          RENDER_STATIC_EXPORT: "1"
          NEXT_PUBLIC_DEMO_STAGING: "1"
        run: npm run build

      - name: Verify static demo output contains no provider secret markers
        working-directory: frontend
        run: |
          test -f out/index.html
          test -f out/brand/vnuhcm-innovation-hub-logo.png
          ! grep -R -E 'OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}|gpt-5\.6-sol' out

      - name: Run Render synthetic demo browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_PYTHON: python
        run: npm run test:e2e:demo
