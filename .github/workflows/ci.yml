name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mcp-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: tools/project-orchestrator-mcp/package-lock.json

      - name: Install, typecheck, build and test MCP
        working-directory: tools/project-orchestrator-mcp
        shell: bash
        env:
          MCP_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MCP_EXPECTED_SHA"
          mcp_ci_dir="$(mktemp -d "$RUNNER_TEMP/mcp-ci.XXXXXXXX")"
          trap 'if [[ "$mcp_ci_dir" == "$RUNNER_TEMP"/mcp-ci.* ]]; then rm -rf -- "$mcp_ci_dir"; fi' EXIT
          [[ "$mcp_ci_dir" == "$RUNNER_TEMP"/mcp-ci.* && "$mcp_ci_dir" == /* ]]
          export PROJECT_ORCH_DB="$mcp_ci_dir/state.sqlite"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "MCP package version: $(node -p "require('./package.json').version")"
          npm ci
          npm run typecheck
          echo "MCP typecheck PASS"
          npm run build
          echo "MCP build PASS"
          npm test
          echo "MCP test suite PASS"

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_OPENAI_LIVE_TESTS: "0"
      RUN_OPENAI_DRAFT_LIVE_TESTS: "0"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      - name: Show Python versions
        run: |
          python --version
          python -m pip --version

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r tests/requirements.txt

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Run offline backend regression
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Install offline document layout QA tools
        run: |
          bash tests/backend/install_p2_006_qa.sh

      - name: Validate synthetic editable DOCX layout using headless LibreOffice
        run: |
          mkdir -p "$RUNNER_TEMP/p2-006-layout-qa"
          python tests/backend/qa_p2_006_libreoffice.py "$RUNNER_TEMP/p2-006-layout-qa"

      - name: Reproduce both public patent reference measurements
        run: |
          mkdir -p "$RUNNER_TEMP/p2-006-reference-qa"
          curl --fail --location --retry 2 https://patentimages.storage.googleapis.com/91/f6/9b/18dc2af29220c8/US11367264.pdf --output "$RUNNER_TEMP/p2-006-reference-qa/US11367264.pdf"
          curl --fail --location --retry 2 https://patentimages.storage.googleapis.com/42/19/af/1c5089854ab9d4/US11044591.pdf --output "$RUNNER_TEMP/p2-006-reference-qa/US11044591.pdf"
          python tests/backend/measure_p2_006_references.py "$RUNNER_TEMP/p2-006-reference-qa" --verify docs/tasks/P2-006-reference-measurements.json --compare "$RUNNER_TEMP/p2-006-layout-qa"

      - name: Archive public reference calibration (QA only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-006-public-reference-calibration
          path: |
            ${{ runner.temp }}/p2-006-reference-qa/*.png
            ${{ runner.temp }}/p2-006-reference-qa/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Archive synthetic renderer layout QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-006-synthetic-layout-qa
          path: |
            ${{ runner.temp }}/p2-006-layout-qa/*.pdf
            ${{ runner.temp }}/p2-006-layout-qa/*.png
            ${{ runner.temp }}/p2-006-layout-qa/*.json
            ${{ runner.temp }}/p2-006-layout-qa/p2-005-*-p2-006/*.pdf
            ${{ runner.temp }}/p2-006-layout-qa/p2-005-*-p2-006/*.docx
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show Node versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Verify DEP-001 full and production security graphs
        working-directory: frontend
        run: |
          mkdir -p "$RUNNER_TEMP/dep-001-security"
          npm audit --json > "$RUNNER_TEMP/dep-001-security/full-audit.json"
          npm audit --omit=dev --json > "$RUNNER_TEMP/dep-001-security/production-audit.json"
          npm ls --all --json > "$RUNNER_TEMP/dep-001-security/dependency-tree.json"
          npm run test:lint-security | tee "$RUNNER_TEMP/dep-001-security/lint-security.log"

      - name: Archive DEP-001 security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-001-security
          path: ${{ runner.temp }}/dep-001-security/
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run synthetic browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_PYTHON: python
        run: npm run test:e2e

      - name: Archive synthetic UIUX browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-003-synthetic-browser-qa
          path: |
            frontend/test-results/
            docs/qa/uiux-003/before/
          if-no-files-found: warn
          retention-days: 7

      - name: Checkout fixed UIUX-003 compatibility source
        uses: actions/checkout@v7
        with:
          ref: 102b7e90dc3bfc1f79c197a20184f97b89070bf2
          path: tmp/dep-001-uiux003-source
          persist-credentials: false

      - name: Verify isolated fixed UIUX-003 compatibility without changing PR 104
        env:
          PLAYWRIGHT_PYTHON: python
          PLAYWRIGHT_BACKEND_PORT: "8104"
          PLAYWRIGHT_FRONTEND_PORT: "3204"
          BACKEND_URL: "http://127.0.0.1:8104"
          PLAYWRIGHT_DEMO_BACKEND_PORT: "8105"
          PLAYWRIGHT_DEMO_FRONTEND_PORT: "3205"
        run: |
          compat="$GITHUB_WORKSPACE/tmp/dep-001-uiux003-source"
          test "$(git -C "$compat" rev-parse HEAD)" = 102b7e90dc3bfc1f79c197a20184f97b89070bf2
          cp frontend/package.json frontend/package-lock.json frontend/.npmrc "$compat/frontend/"
          cp -R frontend/tools "$compat/frontend/tools"
          cd "$compat/frontend"
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx playwright test e2e/integration.spec.ts e2e/uiux-003.spec.ts
          RENDER_STATIC_EXPORT=1 NEXT_PUBLIC_DEMO_STAGING=1 npm run build
          test -f out/index.html
          ! grep -R -E 'OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}|gpt-5\.6-sol' out
          npm run test:e2e:demo

      - name: Archive isolated UIUX-003 compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-001-uiux003-compatibility
          path: tmp/dep-001-uiux003-source/frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build Render static demo export
        working-directory: frontend
        env:
          RENDER_STATIC_EXPORT: "1"
          NEXT_PUBLIC_DEMO_STAGING: "1"
        run: npm run build

      - name: Verify static demo output contains no provider secret markers
        working-directory: frontend
        run: |
          test -f out/index.html
          test -f out/brand/vnuhcm-innovation-hub-logo.png
          ! grep -R -E 'OPENAI_API_KEY|sk-[A-Za-z0-9_-]{20,}|gpt-5\.6-sol' out

      - name: Run Render synthetic demo browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_PYTHON: python
        run: npm run test:e2e:demo
